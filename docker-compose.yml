services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_containers
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_containers"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent_containers
      SECRETS_KEY: ${SECRETS_KEY:?run 'openssl rand -hex 32' and put SECRETS_KEY=... into .env}
      API_TOKEN: ${API_TOKEN:?run ./start.sh or put API_TOKEN=... into .env}
      HOST: 0.0.0.0
      HOMES_DIR: /app/homes
      AGENT_IMAGE: agent-base:latest
    volumes:
      - ./homes:/app/homes
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      API_TOKEN: ${API_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
